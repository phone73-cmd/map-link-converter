<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef5ff"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg"><link rel="apple-touch-icon" href="./assets/apple-touch-icon.png"><link rel="stylesheet" href="./styles.css"><title>Map Link Converter v1.0.0</title></head><body><main class="shell"><header><span class="logo">⌖</span><div><h1>Map Link Converter</h1><p>지도 링크를 간편한 장소 정보로</p></div><span class="version">v1.0.0</span></header><section class="panel"><div class="heading"><h2>지도 링크 입력</h2><span class="tag">Google · Apple</span></div><label for="url">공유 링크</label><textarea id="url" placeholder="Google Maps 또는 Apple Maps 공유 링크를 붙여넣으세요."></textarea><div class="actions"><button id="paste" class="secondary">붙여넣기</button><button id="analyze" class="primary">링크 분석</button><button id="clear" class="ghost">지우기</button></div><p id="message" role="status">공유 링크를 입력하세요.</p></section><section id="result" class="panel" hidden><div class="heading"><h2>분석 결과</h2><span id="provider" class="tag"></span></div><div id="fields"></div><p id="warning" class="notice" hidden></p><div class="actions"><button id="copyAll" class="primary">전체 정보 복사</button><button id="openMap" class="secondary">지도 열기 ↗</button><button id="save" class="secondary">최근 목록에 저장</button></div></section><section class="panel"><div class="heading"><h2>최근 저장한 장소</h2><button id="clearHistory" class="ghost">전체 삭제</button></div><div id="history"></div></section><footer>Map Link Converter · v1.0.0<br>공유 URL의 좌표는 실제 장소 위치와 다를 수 있습니다.</footer></main><script src="./parser.js"></script><script src="./app.js"></script></body></html>
